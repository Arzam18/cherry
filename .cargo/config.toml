# Android-specific compiler settings.
#
# Host build-dependency flags are injected by the workflow's RUSTC_WRAPPER.
# Cargo does not pass target-specific rustflags to host build dependencies
# when `cargo build --target ...` is used.
[target.aarch64-linux-android]
rustflags = ["-Ctarget-cpu=cortex-a76", "-Ctarget-feature=+neon,+dotprod"]

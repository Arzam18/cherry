name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determine Rust Toolchain
        id: rust-version
        run: |
          TC=""
          if [ -f "rust-toolchain.toml" ]; then
            TC=$(grep -i "channel" rust-toolchain.toml | sed -E 's/.*=[[:space:]]*["'\'']?([^"'\''[:space:]]+)["'\'']?.*/\1/' || true)
          elif [ -f "rust-toolchain" ]; then
            TC=$(head -n 1 rust-toolchain | tr -d '\r\n ')
          fi

          if [ -z "$TC" ] || [ "$TC" = "nightly" ]; then
            TC="nightly-2024-10-01"
          fi

          echo "Using Rust toolchain: $TC"
          echo "toolchain=$TC" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download Evaluation Net
        run: python3 ./scripts/download_net.py

      - name: Build Cherry for Android
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: ""
        run: |
          cargo ndk -t arm64-v8a --platform 24 build \
            --release \
            -p cherry \
            --config 'build.rustflags=[]' \
            --config 'target.aarch64-linux-android.rustflags=[]'

          mkdir -p dist/bin
          if [ -f "target/aarch64-linux-android/release/cherry" ]; then
            cp target/aarch64-linux-android/release/cherry dist/bin/Cherry-android-arm64
          else
            cp target/aarch64-linux-android/release/Cherry dist/bin/Cherry-android-arm64
          fi

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-android-arm64
          path: dist/bin/*

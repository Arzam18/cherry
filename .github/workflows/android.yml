name: Build Cherry for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - 'build.rs'
      - '.cargo/config.toml'
      - 'cherry-core/**'
      - 'src/**'
      - 'scripts/download_net.py'
      - '.github/workflows/android.yml'
      - 'rust-toolchain'

permissions:
  contents: read

jobs:
  build:
    name: Android ARM64 NEON Dotprod (embedded kiwi-v3)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Cherry
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain and Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-01-04 --profile minimal
          rustup target add aarch64-linux-android --toolchain nightly-2026-01-04
          rustc +nightly-2026-01-04 --version

      - name: Locate Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail

          NDK=""
          if [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -d "$ANDROID_NDK_LATEST_HOME" ]]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          elif [[ -n "${ANDROID_NDK_HOME:-}" && -d "$ANDROID_NDK_HOME" ]]; then
            NDK="$ANDROID_NDK_HOME"
          else
            SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            if [[ -d "$SDK/ndk" ]]; then
              NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            fi
          fi

          if [[ -z "$NDK" || ! -d "$NDK" ]]; then
            echo "Android NDK not found on this runner" >&2
            exit 1
          fi

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          if [[ ! -x "$LINKER" ]]; then
            echo "Android API 24 ARM64 linker not found: $LINKER" >&2
            exit 1
          fi

          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "Using Android NDK: $NDK"
          "$LINKER" --version | head -n 1

      - name: Download and verify embedded kiwi-v3 network
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/download_net.py
          test -s networks/default.nnue
          echo "83b0c14fa69abd7a6e473290abb40a0c5315bb1fa6976d3e618e7743f6219312  networks/default.nnue" | sha256sum --check
          ls -lh networks/default.nnue

      - name: Configure host SIMD and Android cross-compilation
        shell: bash
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk }}
          ANDROID_TOOLCHAIN: ${{ steps.ndk.outputs.toolchain }}
        run: |
          set -euo pipefail
          LINKER="$ANDROID_TOOLCHAIN/aarch64-linux-android24-clang"

          # Cherry's build.rs imports cherry-core as a build dependency.
          # Cargo compiles that copy for the host, but with --target set it
          # does not pass target rustflags to host build dependencies.
          # Apply AVX2 only to the host cherry-core compilation. BMI2 stays
          # disabled so build.rs generates the same normal-magic slider table
          # layout used by the Android AArch64 build.
          WRAPPER="$RUNNER_TEMP/cherry-rustc-wrapper.sh"
          cat > "$WRAPPER" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          RUSTC="$1"
          shift

          IS_CHERRY_CORE=0
          HAS_TARGET=0
          PREVIOUS=""

          for ARG in "$@"; do
            if [[ "$PREVIOUS" == "--crate-name" && "$ARG" == "cherry_core" ]]; then
              IS_CHERRY_CORE=1
            fi
            if [[ "$ARG" == "--target" || "$ARG" == --target=* ]]; then
              HAS_TARGET=1
            fi
            PREVIOUS="$ARG"
          done

          if [[ "$IS_CHERRY_CORE" -eq 1 && "$HAS_TARGET" -eq 0 ]]; then
            echo "[rustc wrapper] host cherry-core: AVX2 enabled, BMI2 disabled" >&2
            exec "$RUSTC" "$@" -Ctarget-cpu=x86-64 -Ctarget-feature=+avx2,-bmi2
          fi

          exec "$RUSTC" "$@"
          SH
          chmod +x "$WRAPPER"
          echo "RUSTC_WRAPPER=$WRAPPER" >> "$GITHUB_ENV"

          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER"
            echo "CC_aarch64_linux_android=$LINKER"
            echo "CXX_aarch64_linux_android=$ANDROID_TOOLCHAIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$ANDROID_TOOLCHAIN/llvm-ar"
            echo "CFLAGS_aarch64_linux_android=-march=armv8.2-a+dotprod -mtune=cortex-a76"
            echo "CXXFLAGS_aarch64_linux_android=-march=armv8.2-a+dotprod -mtune=cortex-a76"
          } >> "$GITHUB_ENV"

      - name: Compile Cherry ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-01-04 build \
            --release \
            --package cherry \
            --target aarch64-linux-android

      - name: Compile ARM64 SIMD unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-01-04 test \
            --release \
            --package cherry-core \
            --target aarch64-linux-android \
            --no-run

      - name: Verify ARM64 executable and embedded network
        shell: bash
        run: |
          set -euo pipefail

          BIN="target/aarch64-linux-android/release/cherry"
          NET="networks/default.nnue"

          if [[ ! -s "$BIN" ]]; then
            echo "Cherry executable was not produced: $BIN" >&2
            exit 1
          fi

          file "$BIN"
          readelf -hW "$BIN" | grep -q 'AArch64' || {
            echo "Output is not an AArch64 executable" >&2
            exit 1
          }

          python3 - "$BIN" "$NET" <<'PY'
          import pathlib
          import sys

          binary = pathlib.Path(sys.argv[1])
          network = pathlib.Path(sys.argv[2])
          binary_size = binary.stat().st_size
          network_size = network.stat().st_size

          print(f'Executable size: {binary_size:,} bytes')
          print(f'NNUE network size: {network_size:,} bytes')

          if binary_size <= network_size:
              raise SystemExit('Executable is not larger than the embedded network; embedding check failed')

          print('AArch64 executable and embedded-network size check passed.')
          PY

      - name: Upload Cherry engine
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Android-ARM64-NEON-Dotprod-kiwi-v3
          path: target/aarch64-linux-android/release/cherry
          if-no-files-found: error

name: Bundle Source

on:
  workflow_dispatch:
    inputs:
      max_file_size:
        description: 'Max individual file size in bytes (larger files are listed but not inlined)'
        required: false
        default: '524288'
  push:
    branches: [ main, master ]

jobs:
  bundle:
    name: Bundle all source into one file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for git log
          lfs: false              # we do NOT want LFS blobs; pointers/sizes are enough

      - name: Generate source bundle
        env:
          MAX_FILE: ${{ github.event.inputs.max_file_size || '524288' }}
        run: |
          set -euo pipefail

          OUT="bundle-${GITHUB_REPOSITORY##*/}.txt"
          MAX="${MAX_FILE:-524288}"

          # Files we care about. Extensions + a few well-known build files.
          INCLUDE_RE='\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp|inl|asm|s|S|rs|py|sh|bash|zsh|ps1|bat|cmd|java|kt|js|ts|md|rst|txt|yml|yaml|toml|json|ini|cfg|cmake|gradle|properties|pro|pri|mm|swift|go|d|nim|zig)$|(^|/)(CMakeLists\.txt|Makefile|makefile|GNUmakefile|meson\.build|BUILD|BUILD\.bazel|Cargo\.toml|Cargo\.lock|WORKSPACE|build\.gradle|settings\.gradle|\.gitignore|\.gitattributes|\.clang-format|\.clang-tidy|\.editorconfig)$'

          # All tracked files (for the tree + excluded manifest).
          mapfile -t ALL_TRACKED < <(git ls-files || true)
          # Files whose contents we'll actually inline.
          mapfile -t SOURCE_FILES < <(git ls-files | grep -E -i "$INCLUDE_RE" | sort || true)

          # If nothing matched, bail loudly instead of producing an empty file.
          if [ "${#SOURCE_FILES[@]}" -eq 0 ]; then
            echo "No source files matched the include pattern. Bundle will contain only the manifest."
          fi

          {
            echo "===================== REPOSITORY MANIFEST ====================="
            echo "Repository : ${GITHUB_REPOSITORY}"
            echo "Commit     : $(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "Branch/tag : ${GITHUB_REF_NAME}"
            echo "Generated  : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Runner     : ${RUNNER_OS}"
            echo "Run ID     : ${GITHUB_RUN_ID}"
            echo "Max inline : ${MAX} bytes per file"
            echo "Submodules : (contents not included; only paths appear in the tree)"
            echo ""
            echo "Tracked files total : ${#ALL_TRACKED[@]}"
            echo "Inlined source files: ${#SOURCE_FILES[@]}"
            echo ""
            echo "===================== FILE TREE (all tracked) ====================="
            printf '%s\n' "${ALL_TRACKED[@]}"
            echo ""
            echo "===================== RECENT COMMITS ====================="
            git --no-pager log --oneline -30 --no-decorate 2>/dev/null \
              || echo "(no git history available)"
            echo ""
            echo "===================== EXCLUDED FILES (binary or oversize) ====================="
            for f in "${ALL_TRACKED[@]}"; do
              [ -f "$f" ] || continue
              # Skip files that will be inlined anyway.
              if printf '%s\n' "${SOURCE_FILES[@]}" | grep -Fxq -- "$f"; then
                continue
              fi
              sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
              enc=$(file -b --mime-encoding "$f" 2>/dev/null || echo unknown)
              echo "  $f  |  ${sz} bytes  |  ${enc}"
            done
            echo ""
            echo "===================== SOURCE FILES ====================="

            for f in "${SOURCE_FILES[@]}"; do
              [ -f "$f" ] || continue

              sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
              enc=$(file -b --mime-encoding "$f" 2>/dev/null || echo unknown)

              echo ""
              echo "===================== FILE: $f ====================="
              echo "SIZE: ${sz} bytes"
              echo "ENCODING: ${enc}"

              if [ "$sz" -gt "$MAX" ]; then
                echo "(SKIPPED — ${sz} bytes exceeds max_file_size of ${MAX})"
                echo "===================== END FILE: $f ====================="
                continue
              fi

              if printf '%s' "$enc" | grep -qiE 'binary'; then
                echo "(SKIPPED — binary content)"
                echo "===================== END FILE: $f ====================="
                continue
              fi

              echo "----- BEGIN CONTENT -----"
              cat "$f"
              echo ""
              echo "----- END CONTENT -----"
              echo "===================== END FILE: $f ====================="
            done

            echo ""
            echo "===================== END OF BUNDLE ====================="
          } > "$OUT"

          echo "Bundle:      $OUT"
          echo "Size:        $(stat -c%s "$OUT") bytes"
          echo "Lines:       $(wc -l < "$OUT")"
          echo "Files:       ${#SOURCE_FILES[@]}"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-bundle
          path: bundle-*.txt
          if-no-files-found: error
          retention-days: 30
